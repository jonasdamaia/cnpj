<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consulta CNPJ</title>
<style>
:root{--bg:#060c10;--panel:#0b151c;--sf:#0f1c25;--ink:#e8f1ee;--mut:#7f949a;--ln:#1c2f38;--pb:#14503f;--ac:#10b981;--acf:#04150f;--ok:#34d399;--okb:#0f3a2d;--bad:#ff9ea1;--badb:#3d1a1d;--wn:#f2c66b;--wnb:#3b2f10;--bl:#7db3ff;--blb:#14294a;--sk:#1a2d36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#e8efec;--panel:#fff;--sf:#f4f8f6;--ink:#10262a;--mut:#5a6f73;--ln:#d3ddd9;--pb:#b9d9cb;--ac:#0b7a56;--acf:#fff;--ok:#0b7a56;--okb:#d9f0e6;--bad:#a4262c;--badb:#fbe0e0;--wn:#8a5a00;--wnb:#fdf0cf;--bl:#1d4ed8;--blb:#dde8ff;--sk:#e1e8e4;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{padding:18px 14px 40px}
.app{position:relative;max-width:1080px;margin:0 auto;background:var(--panel);border:1px solid var(--pb);border-radius:22px;padding:36px 22px 26px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;min-height:40px}
button:hover{border-color:var(--ac)}
button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.cfg{position:absolute;top:12px;right:12px;z-index:5}
.tm{min-height:40px;min-width:40px;padding:6px;display:grid;place-items:center}
.menu{position:absolute;right:0;top:46px;min-width:230px;background:var(--sf);border:1px solid var(--pb);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px}
.menu button:hover:not(:disabled){background:var(--okb)}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu hr{border:0;border-top:1px solid var(--ln);margin:6px 0}
.hd{text-align:center;margin-bottom:18px}
.hd small{color:var(--ac);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.hd h1{font-size:1.35rem;margin:8px 0 0;line-height:1.3}
.sbox{display:flex;align-items:stretch;max-width:640px;margin:0 auto;background:var(--bg);border:1px solid var(--pb);border-radius:14px;overflow:hidden}
.sbox:focus-within{outline:3px solid var(--ac);outline-offset:2px}
.sbox:has(input[aria-invalid="true"]){border-color:var(--bad)}
.sbox svg{align-self:center;margin-left:16px;color:var(--mut);flex:none}
.sbox input{flex:1 1 auto;min-width:0;min-height:56px;border:0;outline:0;background:transparent;color:var(--ink);font:600 1rem ui-monospace,Consolas,monospace;letter-spacing:.04em;padding:0 14px}
.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:700}
.pri:disabled{opacity:.6;cursor:wait}
.sbox button{border-radius:0;border:0;padding:0 22px;line-height:1.25}
.hint{text-align:center;color:var(--mut);font-size:.82rem;margin:10px 0 0}
#res{margin-top:26px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.card.full{grid-column:1/-1}
.card h3{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card h3 .tag{font-weight:500;text-transform:none}
.top{padding:22px;background:var(--panel);border-color:var(--pb)}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.meta small,.fan{color:var(--mut)}
.chip,.code{font:700 .78rem ui-monospace,Consolas,monospace;color:var(--ok);background:var(--okb);border-radius:6px;padding:2px 8px}
.rowh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.rowh h2{margin:0;font-size:1.5rem;line-height:1.2;overflow-wrap:anywhere}
.fan{margin:4px 0 0}
.badges,.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badges button{min-height:34px;padding:4px 12px;font-size:.85rem}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.8rem;background:var(--okb);color:var(--ok)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.bad{background:var(--badb);color:var(--bad)}.badge.wn{background:var(--wnb);color:var(--wn)}
.nj{padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--blb);color:var(--bl)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid var(--ln)}
.tile{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.tile small{display:block;color:var(--mut);font-size:.78rem}.tile strong{font-size:.95rem;overflow-wrap:anywhere}
.tri,.stack,.grid{display:grid;gap:14px;margin-top:14px}
.tri{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));margin-top:0}
.tri .card{display:flex;flex-direction:column;font-size:.9rem}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.lnk{background:none;border:0;min-height:0;padding:0;color:var(--ac);font:inherit;text-decoration:none}
.lnk:hover{text-decoration:underline}
.sc{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:.88rem}
.sc span{color:var(--mut);font-size:.78rem;text-align:right}
dl{margin:0;display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px 14px}
dt{color:var(--mut);font-size:.9rem}dd{margin:0;overflow-wrap:anywhere}
a{color:var(--ac)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mut);font-weight:600}
details.sec{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:0 18px}
details.sec summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:600;list-style:none}
details.sec summary::-webkit-details-marker,details.acc summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"\25be";margin-left:auto;color:var(--ac)}
details.sec[open] summary::after{content:"\25b4"}
details.sec .scroll{padding-bottom:14px}
.rg{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--ln)}.rg strong{min-width:48px}
details.acc summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;list-style:none}
.mais{color:var(--ac);font-size:.9rem;white-space:nowrap}.mais::after{content:" \25be"}details[open] .mais::after{content:" \25b4"}
.err{background:var(--badb);color:var(--bad);border-radius:12px;padding:18px}
.err strong{display:block;margin-bottom:4px}.err button{margin-top:10px}
.sk{background:var(--sk);border-radius:8px;height:14px;margin:10px 0;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media (max-width:520px){.app{padding:44px 14px 18px}dl{grid-template-columns:1fr;gap:2px}dt{margin-top:8px}.sbox{flex-wrap:wrap}.sbox input{flex:1 1 calc(100% - 50px)}.sbox button{flex:1 1 100%;min-height:48px}.rowh h2{font-size:1.25rem}}
@media print{:root,:root[data-theme]{--bg:#fff;--panel:#fff;--sf:#fff;--ink:#000;--mut:#444;--ln:#bbb;--pb:#bbb;--ac:#065f46;--ok:#065f46;--okb:#e5f4ee}.noprint{display:none!important}.app{border:0}.card,.top{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap"><div class="app">
<div class="cfg noprint"><button id="cfg" class="tm" type="button" aria-label="Configurações e ações" aria-haspopup="menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="menu" class="menu" role="menu" hidden>
<button type="button" role="menuitem" id="tema">Tema</button>
<hr>
<button type="button" role="menuitem" id="cp">Copiar dossiê</button>
<button type="button" role="menuitem" id="js">Exportar JSON</button>
<button type="button" role="menuitem" id="pr">Imprimir</button>
</div></div>
<div class="hd noprint"><small> </small><h1>LUPA CNPJ</h1></div>
<form id="f" class="sbox noprint" novalidate>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 21v-4h6v4"/></svg>
<input id="q" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" aria-label="CNPJ" aria-describedby="h">
<button id="go" class="pri" type="submit">Consultar</button>
</form>
<p class="hint noprint" id="h"> </p>
<main id="res" aria-live="polite"></main>
</div></div>
<script>
const $=s=>document.querySelector(s),res=$("#res"),q=$("#q"),go=$("#go");
let dados=null,ultimo="";
// Tema
const root=document.documentElement;
try{const t=localStorage.getItem("tema");if(t)root.dataset.theme=t}catch(e){}
const menu=$("#menu"),cfg=$("#cfg");
const rot=()=>{$("#tema").textContent=root.dataset.theme==="light"?"Tema: mudar para escuro":"Tema: mudar para claro"};rot();
const fechar=()=>{menu.hidden=true;cfg.setAttribute("aria-expanded","false")};
cfg.onclick=e=>{e.stopPropagation();const abrir=menu.hidden;["cp","js","pr"].forEach(i=>{const b=$("#"+i);b.disabled=!dados;b.title=dados?"":"Faça uma consulta primeiro"});menu.hidden=!abrir;cfg.setAttribute("aria-expanded",String(abrir))};
document.addEventListener("click",e=>{if(!menu.contains(e.target))fechar()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!menu.hidden){fechar();cfg.focus()}});
$("#tema").onclick=()=>{const n=root.dataset.theme==="light"?"dark":"light";root.dataset.theme=n;try{localStorage.setItem("tema",n)}catch(e){}rot()};
$("#cp").onclick=()=>{if(dados)copiar()};
$("#js").onclick=()=>{if(dados){exportar();fechar()}};
$("#pr").onclick=()=>{if(dados){fechar();print()}};
// Utilitários
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vazio=v=>v===null||v===undefined||v===""||(Array.isArray(v)&&!v.length);
const fCnpj=c=>String(c).padStart(14,"0").replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5");
const fCep=c=>String(c).padStart(8,"0").replace(/^(\d{5})(\d{3})$/,"$1-$2");
const fData=d=>{if(!d)return"";const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:d};
const fMoeda=n=>Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fTel=t=>{const d=String(t||"").replace(/\D/g,"");if(d.length===11)return d.replace(/^(\d{2})(\d{5})(\d{4})$/,"($1) $2-$3");if(d.length===10)return d.replace(/^(\d{2})(\d{4})(\d{4})$/,"($1) $2-$3");return t};
const sim=b=>b===true?"Sim":b===false?"Não":"";
const row=(k,v)=>vazio(v)?"":`<dt>${k}</dt><dd>${v}</dd>`;
const card=(t,body,full)=>body?`<section class="card${full?" full":""}"><h3>${t}</h3>${body}</section>`:"";
// Validação oficial dos dígitos verificadores
function valida(c){
  if(c.length!==14)return"O CNPJ precisa ter 14 dígitos. Confira o número digitado.";
  if(/^(\d)\1+$/.test(c))return"CNPJ inválido: todos os dígitos são iguais.";
  const dv=n=>{let p=n-7,s=0;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};
  if(dv(12)!==+c[12]||dv(13)!==+c[13])return"CNPJ inválido: os dígitos verificadores não conferem.";
  return"";
}
// Telas
function skeleton(){res.innerHTML='<div class="grid" aria-busy="true">'+[1,2,3,4].map(()=>'<div class="card"><div class="sk" style="width:40%;height:18px"></div><div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:60%"></div></div>').join("")+"</div>"}
function erro(t,m,retry){res.innerHTML=`<div class="err" role="alert"><strong>${esc(t)}</strong>${esc(m)}${retry?'<br><button type="button" id="tent">Tentar novamente</button>':""}</div>`;const b=$("#tent");if(b)b.onclick=()=>consultar(ultimo)}
function badge(s){const x=String(s||"").toUpperCase();const c=x==="ATIVA"?"":x==="SUSPENSA"||x==="INAPTA"?"wn":"bad";return`<span class="badge ${c}">${esc(s||"Não informada")}</span>`}
const fCnae=c=>String(c||"").padStart(7,"0").replace(/^(\d{2})(\d{2})(\d)(\d{2})$/,"$1.$2-$3/$4");
function mostrar(d){
  const end=[d.descricao_tipo_de_logradouro,d.logradouro,d.numero,d.complemento].filter(Boolean).join(", ");
  const l1=[end,d.bairro].filter(Boolean).join(", ");
  const l2=[d.municipio,d.uf].filter(Boolean).join(" - ")+(d.cep?", CEP: "+fCep(d.cep):"");
  const mapa="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([end,d.bairro,d.municipio,d.uf,d.cep].filter(Boolean).join(", "));
  const tels=[d.ddd_telefone_1,d.ddd_telefone_2].filter(Boolean).map(t=>`<a href="tel:+55${String(t).replace(/\D/g,"")}">${esc(fTel(t))}</a>`).join(" · ");
  const fax=d.ddd_fax?esc(fTel(d.ddd_fax)):"";
  const mail=d.email?`<a href="mailto:${esc(d.email)}">${esc(d.email.toLowerCase())}</a>`:"";
  const sec=(d.cnaes_secundarios||[]).filter(c=>c.codigo&&c.codigo!==0);
  const soc=d.qsa||[];
  const rt=(Array.isArray(d.regime_tributario)?[...d.regime_tributario]:[]).sort((a,b)=>b.ano-a.ano);
  const regAtual=rt.length?String(rt[0].forma_de_tributacao||""):d.opcao_pelo_mei===true?"MEI":d.opcao_pelo_simples===true?"Simples Nacional":"";
  const regTab=rt.length?'<div class="scroll"><table><thead><tr><th>Ano</th><th>Regime</th></tr></thead><tbody>'+rt.map(r=>`<tr><td>${esc(r.ano)}</td><td>${esc(r.forma_de_tributacao)}</td></tr>`).join("")+"</tbody></table></div>":"";
  const linha=r=>`<strong>${esc(r.ano)}</strong><span>${esc(r.forma_de_tributacao)}</span>`;
  const reg=!rt.length?"":rt.length===1?`<div class="rg">${linha(rt[0])}</div>`:`<details class="acc"><summary><span class="rg" style="border:0;padding:0">${linha(rt[0])}</span><span class="mais">Ver anteriores (${rt.length-1})</span></summary>${rt.slice(1).map(r=>`<div class="rg">${linha(r)}</div>`).join("")}</details>`;
  const tile=(k,v)=>`<div class="tile"><small>${k}</small><strong>${v||"—"}</strong></div>`;
  const simples=d.opcao_pelo_simples===true?"Optante":d.opcao_pelo_simples===false?"Não Optante":"";
  const secTab=sec.length?'<div class="scroll"><table><thead><tr><th>Código</th><th>Descrição</th></tr></thead><tbody>'+sec.map(c=>`<tr><td>${esc(fCnae(c.codigo))}</td><td>${esc(c.descricao||"")}</td></tr>`).join("")+"</tbody></table></div>":"";
  const qsaTab=soc.length?'<div class="scroll"><table><thead><tr><th>Nome</th><th>Qualificação</th><th>Entrada</th><th>Faixa etária</th></tr></thead><tbody>'+soc.map(x=>`<tr><td>${esc(x.nome_socio||"")}</td><td>${esc(x.qualificacao_socio||"")}</td><td>${esc(fData(x.data_entrada_sociedade))}</td><td>${esc(x.faixa_etaria||"")}</td></tr>`).join("")+"</tbody></table></div>":"";
  const comp='<dl>'+row("Situação desde",fData(d.data_situacao_cadastral))+row("Motivo da situação",esc(d.descricao_motivo_situacao_cadastral||""))+row("Situação especial",esc(d.situacao_especial||""))+row("Ente federativo",esc(d.ente_federativo_responsavel||""))+row("Optante pelo Simples",simples)+row("Simples Nacional desde",fData(d.data_opcao_pelo_simples))+row("Excluída do Simples",fData(d.data_exclusao_do_simples))+row("Optante pelo MEI",sim(d.opcao_pelo_mei))+"</dl>";
  res.innerHTML=`
  <section class="card top">
    <div class="meta"><span class="chip">${fCnpj(d.cnpj)}</span>${d.descricao_identificador_matriz_filial?`<small>• ${esc(d.descricao_identificador_matriz_filial)}</small>`:""}</div>
    <div class="rowh"><div><h2>${esc(d.razao_social||"Razão social não informada")}</h2>${d.nome_fantasia?`<p class="fan">${esc(d.nome_fantasia)}</p>`:""}</div>
    <div class="badges">${badge(d.descricao_situacao_cadastral)}${d.natureza_juridica?`<span class="nj">${esc(d.natureza_juridica)}</span>`:""}</div></div>
    <div class="stats">${tile("Data de abertura",fData(d.data_inicio_atividade))}${tile("Porte da empresa",esc(d.descricao_porte||d.porte||""))}${tile("Capital social",d.capital_social!=null?fMoeda(d.capital_social):"")}${tile("Regime Tributário Atual",esc(regAtual))}</div>
  </section>
  <div class="tri">
    <section class="card"><h3>Localização &amp; contato<span class="tag">${esc([d.uf,d.municipio].filter(Boolean).join(" / "))}</span></h3>
      <p style="margin:0 0 10px">${esc(l1)}<br>${esc(l2)}</p>
      ${tels||fax?`<p style="margin:0 0 10px">${tels}${fax?(tels?"<br>":"")+"Fax: "+fax:""}</p>`:""}
      <p class="noprint" style="margin:0 0 10px"><a href="${mapa}" target="_blank" rel="noopener">Abrir no Google Maps</a></p>
      ${mail?`<div class="foot"><span>${mail}</span><button type="button" class="lnk noprint" id="cm">Copiar</button></div>`:""}
    </section>
    <section class="card"><h3>Atividade principal${d.cnae_fiscal?`<span class="code">${esc(fCnae(d.cnae_fiscal))}</span>`:""}</h3>
      <p style="margin:0 0 12px">${esc(d.cnae_fiscal_descricao||"Não informada")}</p>
      <div class="foot"><span style="color:var(--mut)">Atividades secundárias</span>${sec.length?`<button type="button" class="lnk" data-open="d-cnae">${sec.length} cadastradas</button>`:"<span>Nenhuma</span>"}</div>
    </section>
    <section class="card"><h3>Quadro societário<span class="tag">${soc.length} ${soc.length===1?"sócio":"sócios"}</span></h3>
      ${soc.slice(0,3).map(x=>`<div class="sc"><b>${esc(x.nome_socio||"")}</b><span>${esc(x.qualificacao_socio||"")}</span></div>`).join("")||'<p style="margin:0;color:var(--mut)">Sem sócios informados.</p>'}
      ${soc.length?`<div class="foot" style="justify-content:flex-end"><button type="button" class="lnk" data-open="d-qsa">Ver QSA completo →</button></div>`:""}
    </section>
  </div>
  <div class="stack">
    ${comp.length>10&&/<dt>/.test(comp)?card("Dados cadastrais complementares",comp):""}
    ${sec.length?`<details class="sec" id="d-cnae"><summary>Atividades secundárias (${sec.length})</summary>${secTab}</details>`:""}
    ${soc.length?`<details class="sec" id="d-qsa"><summary>Quadro societário completo (${soc.length})</summary>${qsaTab}</details>`:""}
    ${rt.length?`<details class="sec" id="d-reg"><summary>Regime tributário (${rt.length})</summary>${regTab}</details>`:""}
  </div>`;
  
  res.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.open);t.open=true;t.scrollIntoView({block:"start"})});
  const cm=$("#cm");if(cm)cm.onclick=async()=>{try{await navigator.clipboard.writeText(d.email);cm.textContent="Copiado"}catch(e){cm.textContent="Não copiou"}setTimeout(()=>cm.textContent="Copiar",2000)};
}
function texto(d){
  const L=[`${d.razao_social} (${fCnpj(d.cnpj)})`,`Situação: ${d.descricao_situacao_cadastral}`];
  if(d.nome_fantasia)L.push("Nome fantasia: "+d.nome_fantasia);
  L.push("Abertura: "+fData(d.data_inicio_atividade),"Natureza jurídica: "+(d.natureza_juridica||""),"Capital social: "+(d.capital_social!=null?fMoeda(d.capital_social):""));
  L.push("Endereço: "+[d.logradouro,d.numero,d.complemento,d.bairro,d.municipio+"/"+d.uf,"CEP "+fCep(d.cep||"")].filter(Boolean).join(", "));
  if(d.ddd_telefone_1)L.push("Telefone: "+fTel(d.ddd_telefone_1));
  if(d.email)L.push("E-mail: "+d.email);
  L.push("CNAE principal: "+d.cnae_fiscal+" - "+(d.cnae_fiscal_descricao||""));
  (d.qsa||[]).forEach(s=>L.push("Sócio: "+s.nome_socio+" ("+s.qualificacao_socio+")"));
  return L.join("\n");
}
async function copiar(){const b=$("#cp");try{await navigator.clipboard.writeText(texto(dados));b.textContent="Dados copiados"}catch(e){b.textContent="Não foi possível copiar"}setTimeout(()=>b.textContent="Copiar dossiê",2000)}
function exportar(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(dados,null,2)],{type:"application/json"}));a.download="cnpj-"+dados.cnpj+".json";document.body.appendChild(a);a.click();a.remove()}
addEventListener("beforeprint",()=>document.querySelectorAll("details").forEach(x=>x.open=true));
// Consulta
async function consultar(c){
  ultimo=c;go.disabled=true;skeleton();dados=null;
  try{
    const r=await fetch("https://brasilapi.com.br/api/cnpj/v1/"+c);
    if(r.status===404)return erro("CNPJ não encontrado","Não há empresa cadastrada com esse número. Confira os dígitos e tente de novo.");
    if(r.status===400)return erro("CNPJ recusado pela API","O número informado não é um CNPJ válido para a BrasilAPI.");
    if(r.status===429)return erro("Muitas consultas em pouco tempo","Aguarde alguns segundos e tente novamente.",true);
    if(!r.ok)return erro("Serviço indisponível","A BrasilAPI respondeu com erro "+r.status+". Tente novamente em instantes.",true);
    dados=await r.json();mostrar(dados);
  }catch(e){
    erro("Sem conexão com a BrasilAPI","Verifique sua internet. Se esta página está aberta dentro do claude.ai, o navegador bloqueia consultas externas: baixe o arquivo index.html e abra no seu computador.",true);
  }finally{go.disabled=false}
}
$("#f").addEventListener("submit",e=>{
  e.preventDefault();
  const c=q.value.replace(/\D/g,""),m=valida(c);
  q.setAttribute("aria-invalid",m?"true":"false");
  if(m){dados=null;return erro("Confira o CNPJ",m)}
  q.value="";consultar(c);
});
q.addEventListener("input",()=>q.setAttribute("aria-invalid","false"));
</script>
</body>
